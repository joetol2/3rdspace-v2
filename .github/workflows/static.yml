# Build and deploy a TanStack Start app to GitHub Pages.
# The vite build produces client assets in .output/public/assets/.
# The prerender step calls the built SSR bundle to generate index.html
# and 404.html (404.html enables SPA routing on GitHub Pages).
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 8,20 * * *"  # rebuild at 8am and 8pm UTC (midnight and noon Pacific)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          BASE_PATH: /

      - name: Prerender index.html and 404.html
        run: node scripts/prerender.mjs
        env:
          BASE_PATH: /

      # Same events, on our own origin, for client-side navigations to
      # /calendar (which never request the prerendered file). Fails the build
      # if the feed cannot be read, rather than deploying an empty calendar.
      - name: Bake the calendar feed to JSON
        run: bun scripts/build-calendar-json.ts

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.output/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
